<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image Editor - CSS Filters</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .editor-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            background-color: #000;
            position: relative;
        }

        /* --- TOP TOOLBAR --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            font-size: 16px;
            z-index: 10;
        }

        .top-left, .top-right {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: opacity 0.2s;
        }
        
        .icon-btn:active { opacity: 0.6; }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .save-text {
            font-size: 16px;
            color: #888;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- MAIN IMAGE AREA --- */
        .image-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            overflow: hidden;
            background-color: #111;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The image now holds ALL the CSS filters and transforms */
        #editorImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            /* Default CSS Filter State */
            filter: brightness(100%) contrast(100%) saturate(100%) hue-rotate(0deg) sepia(0%) grayscale(0%) blur(0px) invert(0%) opacity(100%);
            transition: filter 0.1s ease-out; /* Smooth transition when filters change */
        }

        /* Crop Overlay */
        .crop-overlay {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            pointer-events: none; 
            display: none; 
            z-index: 5;
        }
        
        .crop-overlay::before, .crop-overlay::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
        }
        .crop-overlay::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .crop-overlay::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* --- BOTTOM CONTROLS --- */
        .bottom-controls {
            background-color: #000;
            padding-bottom: 20px;
            z-index: 10;
        }

        .auto-row {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
        }

        .auto-btn {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .auto-btn:active { background: #333; }

        /* Slider/Ruler */
        .slider-container {
            width: 100%;
            height: 30px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            margin-bottom: 10px;
        }

        .ruler {
            width: 100%;
            height: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-image: repeating-linear-gradient(
                to right,
                #444 0,
                #444 1px,
                transparent 1px,
                transparent 15px
            );
            background-size: 15px 100%;
            position: relative;
        }

        .slider-thumb {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 25px;
            background-color: #FFC107;
            border-radius: 2px;
            box-shadow: 0 0 5px rgba(255, 193, 7, 0.5);
            cursor: pointer;
            pointer-events: none; 
        }

        /* Tool Grid */
        .tool-grid {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 15px;
            scrollbar-width: none; 
        }
        
        .tool-grid::-webkit-scrollbar { display: none; }

        .tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            height: 65px;
            border-radius: 12px;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 10px;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .tool-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tool-item.active {
            background-color: #FFC107;
            color: #000;
            font-weight: bold;
        }
        
        .tool-item.active svg { stroke: #000; }

        /* Text Tool Row */
        .text-tools {
            display: flex;
            justify-content: space-around;
            padding: 15px 10px 5px 10px;
            font-size: 13px;
            color: #888;
            border-top: 1px solid #222;
        }

        .text-tool-item {
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: color 0.2s;
        }

        .text-tool-item.active-text {
            color: #FFC107;
            font-weight: bold;
            background-color: rgba(255, 193, 7, 0.1);
        }

    </style>
</head>
<body>

<div class="editor-container">
    
    <!-- TOP TOOLBAR -->
    <div class="top-bar">
        <div class="top-left">
            <button class="icon-btn" onclick="resetImage()">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="icon-btn" onclick="undoAction()">
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>
            <button class="icon-btn" onclick="redoAction()">
                <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
            </button>
        </div>
        <div class="top-right">
            <span class="save-text" onclick="saveImage()">Save</span>
            <button class="icon-btn" onclick="console.log('More options')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </button>
        </div>
    </div>

    <!-- MAIN IMAGE AREA -->
    <div class="image-area">
        <div class="image-wrapper">
            <!-- The image now uses CSS filters -->
            <img id="editorImage" src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Editor Image" crossorigin="anonymous">
            
            <!-- Crop Overlay Lines -->
            <div class="crop-overlay" id="cropOverlay"></div>
        </div>
    </div>

    <!-- BOTTOM CONTROLS -->
    <div class="bottom-controls">
        
        <div class="auto-row">
            <button class="auto-btn" onclick="applyAuto()">Auto</button>
        </div>

        <!-- Ruler / Slider -->
        <div class="slider-container" id="sliderContainer">
            <div class="ruler"></div>
            <div class="slider-thumb" id="sliderThumb"></div>
        </div>

        <!-- Main Tool Icons -->
        <div class="tool-grid">
            <div class="tool-item" data-tool="aspect" onclick="selectTool(this, 'aspect')">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                <span>Aspect ratio</span>
            </div>
            <div class="tool-item active" data-tool="rotate" onclick="selectTool(this, 'rotate')">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85 1.03 6.5 2.7L21 8"/><line x1="21" y1="3" x2="21" y2="8"/><line x1="16" y1="8" x2="21" y2="8"/></svg>
                <span>Rotate</span>
            </div>
            <div class="tool-item" data-tool="horizontal" onclick="selectTool(this, 'horizontal')">
                <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l4-4 4 4"/><path d="M8 17l4 4 4-4"/></svg>
                <span>Horizontal</span>
            </div>
            <div class="tool-item" data-tool="vertical" onclick="selectTool(this, 'vertical')">
                <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/></svg>
                <span>Vertical</span>
            </div>
            <div class="tool-item" data-tool="distort" onclick="selectTool(this, 'distort')">
                <svg viewBox="0 0 24 24"><polygon points="4 6 20 6 18 18 6 18 4 6"/></svg>
                <span>Distort</span>
            </div>
        </div>

        <!-- Bottom Text Tools (Now control the slider mode) -->
        <div class="text-tools">
            <span class="text-tool-item active-text" onclick="setSliderMode(this, 'brightness')">Brightness</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'contrast')">Contrast</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'saturate')">Saturate</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'hue-rotate')">Hue</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'sepia')">Sepia</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'grayscale')">Grayscale</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'blur')">Blur</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'invert')">Invert</span>
            <span class="text-tool-item" onclick="setSliderMode(this, 'opacity')">Opacity</span>
        </div>

    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    const img = document.getElementById('editorImage');
    
    // Central state for all CSS Filters (1 = 100%)
    let filters = {
        brightness: 1,
        contrast: 1,
        saturate: 1,
        'hue-rotate': 0,
        sepia: 0,
        grayscale: 0,
        blur: 0,
        invert: 0,
        opacity: 1
    };

    // Track rotation/flip state (using CSS transforms)
    let transforms = {
        rotation: 0,
        flipH: 1,
        flipV: 1
    };

    // Current slider mode (which filter is the slider controlling?)
    let currentSliderMode = 'brightness';

    // --- CORE RENDER FUNCTION ---
    function updateImageStyle() {
        // Build the CSS Filter string
        const filterString = `
            brightness(${filters.brightness * 100}%) 
            contrast(${filters.contrast * 100}%) 
            saturate(${filters.saturate * 100}%) 
            hue-rotate(${filters['hue-rotate']}deg) 
            sepia(${filters.sepia * 100}%) 
            grayscale(${filters.grayscale * 100}%) 
            blur(${filters.blur}px) 
            invert(${filters.invert * 100}%) 
            opacity(${filters.opacity * 100}%)
        `;
        
        // Build the CSS Transform string
        const transformString = `
            rotate(${transforms.rotation}deg) 
            scale(${transforms.flipH}, ${transforms.flipV})
        `;

        img.style.filter = filterString;
        img.style.transform = transformString;
    }

    // --- TOOL ACTIONS (Rotation & Flip) ---
    function selectTool(element, toolName) {
        document.querySelectorAll('.tool-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        switch(toolName) {
            case 'rotate':
                transforms.rotation = (transforms.rotation + 90) % 360;
                updateImageStyle();
                break;
            case 'horizontal':
                transforms.flipH *= -1;
                updateImageStyle();
                break;
            case 'vertical':
                transforms.flipV *= -1;
                updateImageStyle();
                break;
            case 'aspect':
                alert("Aspect ratio tool coming soon!");
                break;
            case 'distort':
                alert("Distort tool coming soon!");
                break;
        }
    }

    // --- SLIDER MODE SELECTION ---
    function setSliderMode(element, mode) {
        // Update UI
        document.querySelectorAll('.text-tool-item').forEach(el => el.classList.remove('active-text'));
        element.classList.add('active-text');
        
        currentSliderMode = mode;
        
        // Reset slider thumb to match the current value of the selected filter
        resetSliderThumb();
    }

    function resetSliderThumb() {
        const sliderContainer = document.getElementById('sliderContainer');
        const sliderThumb = document.getElementById('sliderThumb');
        const rect = sliderContainer.getBoundingClientRect();
        
        let percentage = 0.5; // default center

        // Determine what the slider value should be based on the current filter
        switch(currentSliderMode) {
            case 'brightness':
            case 'contrast':
            case 'saturate':
            case 'opacity':
                // These are 0 to 2 (0% to 200%), so 1 is center (50%)
                percentage = filters[currentSliderMode] / 2; 
                break;
            case 'hue-rotate':
                // 0 to 360, so 180 is center (50%)
                percentage = filters[currentSliderMode] / 360;
                break;
            case 'sepia':
            case 'grayscale':
            case 'invert':
                // 0 to 1 (0% to 100%), so 0.5 is center (50%)
                percentage = filters[currentSliderMode];
                break;
            case 'blur':
                // 0 to 10px, so 5 is center (50%)
                percentage = filters[currentSliderMode] / 10;
                break;
        }

        // Clamp between 0 and 1
        percentage = Math.max(0, Math.min(1, percentage));
        
        // Position thumb
        const x = percentage * rect.width;
        sliderThumb.style.left = `${x}px`;
    }

    // --- SLIDER LOGIC ---
    const sliderContainer = document.getElementById('sliderContainer');
    const sliderThumb = document.getElementById('sliderThumb');
    let isDragging = false;

    function updateSlider(clientX) {
        const rect = sliderContainer.getBoundingClientRect();
        let x = clientX - rect.left;
        
        // Clamp within container
        if (x < 0) x = 0;
        if (x > rect.width) x = rect.width;
        
        sliderThumb.style.left = `${x}px`;
        
        // Calculate percentage (0 to 1)
        const percentage = x / rect.width;

        // Map percentage to the active filter value
        switch(currentSliderMode) {
            case 'brightness':
            case 'contrast':
            case 'saturate':
            case 'opacity':
                filters[currentSliderMode] = percentage * 2; // 0 to 2
                break;
            case 'hue-rotate':
                filters[currentSliderMode] = percentage * 360; // 0 to 360
                break;
            case 'sepia':
            case 'grayscale':
            case 'invert':
                filters[currentSliderMode] = percentage; // 0 to 1
                break;
            case 'blur':
                filters[currentSliderMode] = percentage * 10; // 0 to 10px
                break;
        }
        
        updateImageStyle();
    }

    // Mouse events
    sliderContainer.addEventListener('mousedown', (e) => { isDragging = true; updateSlider(e.clientX); });
    window.addEventListener('mousemove', (e) => { if (isDragging) updateSlider(e.clientX); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Touch events
    sliderContainer.addEventListener('touchstart', (e) => { isDragging = true; updateSlider(e.touches[0].clientX); }, {passive: true});
    window.addEventListener('touchmove', (e) => { if (isDragging) updateSlider(e.touches[0].clientX); }, {passive: true});
    window.addEventListener('touchend', () => { isDragging = false; });

    // --- UTILITY FUNCTIONS ---
    function resetImage() {
        filters = { brightness: 1, contrast: 1, saturate: 1, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 };
        transforms = { rotation: 0, flipH: 1, flipV: 1 };
        currentSliderMode = 'brightness';
        
        // Reset UI
        document.querySelectorAll('.text-tool-item').forEach(el => el.classList.remove('active-text'));
        document.querySelector('.text-tool-item').classList.add('active-text');
        
        updateImageStyle();
        resetSliderThumb();
    }

    function applyAuto() {
        // A simple "Auto" enhancement
        filters.contrast = 1.2;
        filters.saturate = 1.3;
        filters.brightness = 1.05;
        updateImageStyle();
        
        // Update slider to reflect current mode
        resetSliderThumb();
    }

    function undoAction() { console.log("Undo clicked - History stack not yet implemented"); }
    function redoAction() { console.log("Redo clicked - History stack not yet implemented"); }
    
    function saveImage() {
        // Note: Saving CSS filters requires drawing to a canvas, which doesn't natively support CSS filters.
        // For this phase, we just trigger a download of the raw image.
        // (In Phase 3, we would use html2canvas or a similar library to rasterize the CSS-filtered image).
        alert("Save functionality in CSS mode requires rasterization. In a real app, we would use html2canvas.");
        
        // Basic save of the original (unfiltered) image for demonstration:
        const link = document.createElement('a');
        link.download = 'edited-image.jpg';
        link.href = img.src;
        link.click();
    }

    // Initialize
    updateImageStyle();
    resetSliderThumb();

</script>

</body>
</html>
