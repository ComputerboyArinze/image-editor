<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Editor</title>
<style>
    * {
     box-sizing: border-box;
      margin: 0;
       padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .editor-container { width: 100%; height: 100%; max-width: 480px; display: flex; flex-direction: column; background: #000; position: relative; }

    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 10; }
    .top-left, .top-right { display: flex; gap: 20px; align-items: center; }
    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; padding: 5px; transition: opacity 0.2s; }
    .icon-btn:active { opacity: 0.6; }
    .icon-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .save-text { color: #FFC107; cursor: pointer; font-weight: bold; }

    /* Image Area */
    .image-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden; background: #111; }
    .image-wrapper { position: relative; display: inline-block; max-width: 100%; max-height: 100%; line-height: 0; }
    #editorImage { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; display: block; }

    /* Crop Overlay */
    .crop-overlay { position: absolute; border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); display: none; z-index: 5; cursor: move; touch-action: none; }
    .crop-handle { position: absolute; width: 22px; height: 22px; background: #FFC107; border-radius: 50%; border: 2px solid #000; z-index: 6; touch-action: none; }
    .crop-handle.tl { top: -11px; left: -11px; cursor: nwse-resize; }
    .crop-handle.tr { top: -11px; right: -11px; cursor: nesw-resize; }
    .crop-handle.bl { bottom: -11px; left: -11px; cursor: nesw-resize; }
    .crop-handle.br { bottom: -11px; right: -11px; cursor: nwse-resize; }

    /* Text Overlay */
    .text-overlay { position: absolute; color: #fff; font-weight: bold; font-size: 24px; cursor: move; user-select: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); padding: 5px; border: 1px dashed transparent; z-index: 7; display: none; touch-action: none; white-space: nowrap; }
    .text-overlay.active { border-color: #FFC107; }

    /* Bottom Controls */
    .bottom-controls { background: #000; padding-bottom: 15px; z-index: 10; max-height: 45vh; overflow-y: auto; scrollbar-width: none; }
    .bottom-controls::-webkit-scrollbar { display: none; }

    .auto-row { display: flex; justify-content: center; padding: 10px 0; gap: 10px; }
    .auto-btn { background: transparent; border: 1px solid #444; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 14px; cursor: pointer; }
    .auto-btn:active { background: #333; }
    .auto-btn.primary { background: #FFC107; color: #000; border-color: #FFC107; font-weight: bold; }
    .auto-btn.hidden { display: none; }

    /* Slider */
    .slider-container { width: 100%; height: 30px; display: flex; align-items: center; padding: 0 20px; position: relative; margin-bottom: 8px; touch-action: none; }
    .ruler { width: 100%; height: 15px; background-image: repeating-linear-gradient(to right, #444 0, #444 1px, transparent 1px, transparent 15px); background-size: 15px 100%; position: relative; }
    .slider-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 4px; height: 25px; background: #FFC107; border-radius: 2px; box-shadow: 0 0 5px rgba(255,193,7,0.5); pointer-events: none; }

    /* Tool Grid */
    .tool-grid { display: flex; overflow-x: auto; gap: 10px; padding: 0 15px 10px; scrollbar-width: none; }
    .tool-grid::-webkit-scrollbar { display: none; }
    .tool-item { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 65px; height: 65px; border-radius: 12px; background: #1a1a1a; color: #fff; font-size: 10px; gap: 5px; cursor: pointer; border: 1px solid transparent; flex-shrink: 0; }
    .tool-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tool-item.active { background: #FFC107; color: #000; font-weight: bold; }
    .tool-item.active svg { stroke: #000; }

    /* Presets */
    .presets-row { display: flex; overflow-x: auto; gap: 8px; padding: 8px 20px; scrollbar-width: none; }
    .presets-row::-webkit-scrollbar { display: none; }
    .preset-btn { flex-shrink: 0; padding: 8px 14px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; color: #fff; font-size: 12px; cursor: pointer; }
    .preset-btn:active { background: #FFC107; color: #000; border-color: #FFC107; }

    /* Text Tools */
    .text-tools { display: flex; overflow-x: auto; gap: 15px; padding: 10px 20px 5px; font-size: 13px; color: #888; border-top: 1px solid #222; scrollbar-width: none; }
    .text-tools::-webkit-scrollbar { display: none; }
    .text-tool-item { cursor: pointer; padding: 5px 10px; border-radius: 5px; flex-shrink: 0; white-space: nowrap; }
    .text-tool-item.active-text { color: #FFC107; font-weight: bold; background: rgba(255,193,7,0.1); }

    /* Text Editor Panel */
    .text-editor { display: none; padding: 10px 20px; gap: 10px; align-items: center; background: #1a1a1a; border-top: 1px solid #222; }
    .text-editor.show { display: flex; }
    .text-editor input[type="text"] { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; font-size: 14px; min-width: 0; }
    .text-editor input[type="color"] { width: 35px; height: 35px; border: none; background: none; cursor: pointer; padding: 0; }

    /* Toast */
    .toast { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: #FFC107; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; white-space: nowrap; }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="editor-container">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-left">
            <button class="icon-btn" id="pickBtn" title="Choose Image">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <button class="icon-btn" id="undoBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>
            <button class="icon-btn" id="redoBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13"/></svg>
            </button>
        </div>
        <div class="top-right">
            <span class="save-text" id="saveBtn">Save</span>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <!-- IMAGE AREA -->
    <div class="image-area">
        <div class="image-wrapper" id="imageWrapper">
            <img id="editorImage" alt="Editor preview">
            <div class="crop-overlay" id="cropOverlay">
                <div class="crop-handle tl" data-corner="tl"></div>
                <div class="crop-handle tr" data-corner="tr"></div>
                <div class="crop-handle bl" data-corner="bl"></div>
                <div class="crop-handle br" data-corner="br"></div>
            </div>
            <div class="text-overlay" id="textOverlay">Your Text</div>
        </div>
    </div>

    <!-- BOTTOM CONTROLS -->
    <div class="bottom-controls">

        <div class="auto-row">
            <button class="auto-btn" id="autoBtn">Auto</button>
            <button class="auto-btn primary hidden" id="applyCropBtn">Apply Crop</button>
            <button class="auto-btn primary hidden" id="applyTextBtn">Add Text</button>
        </div>

        <!-- Text Editor Panel -->
        <div class="text-editor" id="textEditor">
            <input type="text" id="textInput" placeholder="Enter text..." value="Your Text" maxlength="50">
            <input type="color" id="textColor" value="#ffffff">
            <button class="auto-btn primary" id="confirmTextBtn" style="padding:6px 12px;">OK</button>
        </div>

        <!-- Slider -->
        <div class="slider-container" id="sliderContainer">
            <div class="ruler"></div>
            <div class="slider-thumb" id="sliderThumb"></div>
        </div>

        <!-- Tools -->
        <div class="tool-grid">
            <div class="tool-item" data-tool="rotate">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85 1.03 6.5 2.7L21 8"/><line x1="21" y1="3" x2="21" y2="8"/><line x1="16" y1="8" x2="21" y2="8"/></svg>
                <span>Rotate</span>
            </div>
            <div class="tool-item" data-tool="horizontal">
                <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l4-4 4 4"/><path d="M8 17l4 4 4-4"/></svg>
                <span>Flip H</span>
            </div>
            <div class="tool-item" data-tool="vertical">
                <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8l-4 4 4 4"/><path d="M17 8l4 4-4 4"/></svg>
                <span>Flip V</span>
            </div>
            <div class="tool-item" data-tool="crop">
                <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                <span>Crop</span>
            </div>
            <div class="tool-item" data-tool="text">
                <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                <span>Text</span>
            </div>
        </div>

        <!-- Presets -->
        <div class="presets-row">
            <button class="preset-btn" data-preset="none">Original</button>
            <button class="preset-btn" data-preset="vintage">Vintage</button>
            <button class="preset-btn" data-preset="bw">B&W</button>
            <button class="preset-btn" data-preset="cinematic">Cinematic</button>
            <button class="preset-btn" data-preset="warm">Warm</button>
            <button class="preset-btn" data-preset="cool">Cool</button>
            <button class="preset-btn" data-preset="dramatic">Dramatic</button>
            <button class="preset-btn" data-preset="fade">Fade</button>
        </div>

        <!-- Slider Modes -->
        <div class="text-tools">
            <span class="text-tool-item active-text" data-slider="brightness">Brightness</span>
            <span class="text-tool-item" data-slider="contrast">Contrast</span>
            <span class="text-tool-item" data-slider="saturate">Saturate</span>
            <span class="text-tool-item" data-slider="hue-rotate">Hue</span>
            <span class="text-tool-item" data-slider="sepia">Sepia</span>
            <span class="text-tool-item" data-slider="grayscale">Grayscale</span>
            <span class="text-tool-item" data-slider="blur">Blur</span>
            <span class="text-tool-item" data-slider="invert">Invert</span>
            <span class="text-tool-item" data-slider="opacity">Opacity</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   1. ELEMENT REFERENCES
   ========================================================= */
const img = document.getElementById('editorImage');
const wrapper = document.getElementById('imageWrapper');
const cropOverlay = document.getElementById('cropOverlay');
const textOverlay = document.getElementById('textOverlay');
const textEditor = document.getElementById('textEditor');
const fileInput = document.getElementById('fileInput');
const toastEl = document.getElementById('toast');
const applyCropBtn = document.getElementById('applyCropBtn');
const applyTextBtn = document.getElementById('applyTextBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const sliderContainer = document.getElementById('sliderContainer');
const sliderThumb = document.getElementById('sliderThumb');

/* =========================================================
   2. STATE
   ========================================================= */
let filters = { brightness: 1, contrast: 1, saturate: 1, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 };
let transforms = { rotation: 0, flipH: 1, flipV: 1 };
let currentSliderMode = 'brightness';

let cropActive = false;
let cropRect = { x: 0.15, y: 0.15, w: 0.7, h: 0.7 };

let textActive = false;
let textData = { text: 'Your Text', color: '#ffffff', size: 24, x: 0.5, y: 0.5 };

// History: stores full state including imageData (base64) so crop is undoable
let history = [];
let historyIndex = -1;

/* =========================================================
   3. HELPERS
   ========================================================= */
function showToast(msg, duration = 1800) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), duration);
}

function buildCssFilterString() {
    return [
        `brightness(${filters.brightness * 100}%)`,
        `contrast(${filters.contrast * 100}%)`,
        `saturate(${filters.saturate * 100}%)`,
        `hue-rotate(${filters['hue-rotate']}deg)`,
        `sepia(${filters.sepia * 100}%)`,
        `grayscale(${filters.grayscale * 100}%)`,
        `blur(${filters.blur}px)`,
        `invert(${filters.invert * 100}%)`,
        `opacity(${filters.opacity * 100}%)`
    ].join(' ');
}

function updateImageStyle() {
    img.style.filter = buildCssFilterString();
    img.style.transform = `rotate(${transforms.rotation}deg) scale(${transforms.flipH}, ${transforms.flipV})`;

    // Update text overlay visual
    textOverlay.textContent = textData.text;
    textOverlay.style.color = textData.color;
    textOverlay.style.fontSize = textData.size + 'px';
    positionTextOverlay();
}

function positionTextOverlay() {
    const rect = wrapper.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    textOverlay.style.left = `${textData.x * rect.width}px`;
    textOverlay.style.top = `${textData.y * rect.height}px`;
    textOverlay.style.transform = 'translate(-50%, -50%)';
}

/* =========================================================
   4. HISTORY  (stores image data so crop is undoable)
   ========================================================= */
function captureState() {
    return {
        filters: { ...filters },
        transforms: { ...transforms },
        textData: { ...textData },
        textActive,
        imageSrc: img.src // base64 dataURL after first load
    };
}

function pushState() {
    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }
    history.push(captureState());
    if (history.length > 30) history.shift(); // cap memory
    historyIndex = history.length - 1;
    updateHistoryButtons();
}

function restoreState(state) {
    filters = { ...state.filters };
    transforms = { ...state.transforms };
    textData = { ...state.textData };
    textActive = state.textActive;

    img.src = state.imageSrc;
    img.onload = () => {
        updateImageStyle();
        resetSliderThumb();
        textOverlay.style.display = textActive ? 'block' : 'none';
        // Hide crop overlay whenever we restore
        cropActive = false;
        cropOverlay.style.display = 'none';
        applyCropBtn.classList.add('hidden');
    };
}

function updateHistoryButtons() {
    undoBtn.disabled = historyIndex <= 0;
    redoBtn.disabled = historyIndex >= history.length - 1;
}

undoBtn.addEventListener('click', () => {
    if (historyIndex > 0) { historyIndex--; restoreState(history[historyIndex]); updateHistoryButtons(); }
});
redoBtn.addEventListener('click', () => {
    if (historyIndex < history.length - 1) { historyIndex++; restoreState(history[historyIndex]); updateHistoryButtons(); }
});

/* =========================================================
   5. IMAGE LOADING (Local file only — prevents CORS taint)
   ========================================================= */
document.getElementById('pickBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        img.onload = () => {
            // Reset everything
            filters = { brightness: 1, contrast: 1, saturate: 1, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 };
            transforms = { rotation: 0, flipH: 1, flipV: 1 };
            textData = { text: 'Your Text', color: '#ffffff', size: 24, x: 0.5, y: 0.5 };
            textActive = false;
            textOverlay.style.display = 'none';
            cropActive = false;
            cropOverlay.style.display = 'none';
            applyCropBtn.classList.add('hidden');

            updateImageStyle();
            resetSliderThumb();

            // Reset history with this image as the base
            history = [];
            historyIndex = -1;
            pushState();
        };
        img.src = ev.target.result;
        showToast('Image loaded');
    };
    reader.readAsDataURL(file);
    fileInput.value = ''; // allow re-selecting same file
});

/* =========================================================
   6. ROTATE / FLIP
   ========================================================= */
document.querySelectorAll('.tool-item').forEach(item => {
    item.addEventListener('click', () => {
        const tool = item.dataset.tool;
        document.querySelectorAll('.tool-item').forEach(t => t.classList.remove('active'));
        item.classList.add('active');

        if (tool === 'rotate') {
            transforms.rotation = (transforms.rotation + 90) % 360;
            updateImageStyle();
            pushState();
        } else if (tool === 'horizontal') {
            transforms.flipH *= -1;
            updateImageStyle();
            pushState();
        } else if (tool === 'vertical') {
            transforms.flipV *= -1;
            updateImageStyle();
            pushState();
        } else if (tool === 'crop') {
            toggleCropMode();
        } else if (tool === 'text') {
            toggleTextMode();
        }
    });
});

/* =========================================================
   7. FILTER SLIDER
   ========================================================= */
document.querySelectorAll('.text-tool-item').forEach(el => {
    el.addEventListener('click', () => {
        document.querySelectorAll('.text-tool-item').forEach(t => t.classList.remove('active-text'));
        el.classList.add('active-text');
        currentSliderMode = el.dataset.slider;
        resetSliderThumb();
    });
});

function resetSliderThumb() {
    const rect = sliderContainer.getBoundingClientRect();
    let pct = 0.5;
    switch (currentSliderMode) {
        case 'brightness': case 'contrast': case 'saturate': case 'opacity':
            pct = filters[currentSliderMode] / 2; break;
        case 'hue-rotate': pct = filters[currentSliderMode] / 360; break;
        case 'sepia': case 'grayscale': case 'invert':
            pct = filters[currentSliderMode]; break;
        case 'blur': pct = filters[currentSliderMode] / 10; break;
    }
    pct = Math.max(0, Math.min(1, pct));
    sliderThumb.style.left = `${pct * rect.width}px`;
}

let isDraggingSlider = false;
function setSliderFromX(clientX) {
    const rect = sliderContainer.getBoundingClientRect();
    const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
    sliderThumb.style.left = `${x}px`;
    const pct = x / rect.width;
    switch (currentSliderMode) {
        case 'brightness': case 'contrast': case 'saturate': case 'opacity':
            filters[currentSliderMode] = pct * 2; break;
        case 'hue-rotate': filters[currentSliderMode] = pct * 360; break;
        case 'sepia': case 'grayscale': case 'invert':
            filters[currentSliderMode] = pct; break;
        case 'blur': filters[currentSliderMode] = pct * 10; break;
    }
    updateImageStyle();
}
sliderContainer.addEventListener('pointerdown', (e) => {
    isDraggingSlider = true;
    sliderContainer.setPointerCapture(e.pointerId);
    setSliderFromX(e.clientX);
});
sliderContainer.addEventListener('pointermove', (e) => { if (isDraggingSlider) setSliderFromX(e.clientX); });
sliderContainer.addEventListener('pointerup', () => { if (isDraggingSlider) { isDraggingSlider = false; pushState(); } });

/* =========================================================
   8. PRESETS
   ========================================================= */
const PRESETS = {
    none:      { brightness: 1, contrast: 1, saturate: 1, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    vintage:   { brightness: 0.95, contrast: 1.1, saturate: 0.8, 'hue-rotate': 0, sepia: 0.5, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    bw:        { brightness: 1, contrast: 1.2, saturate: 1, 'hue-rotate': 0, sepia: 0, grayscale: 1, blur: 0, invert: 0, opacity: 1 },
    cinematic: { brightness: 0.9, contrast: 1.3, saturate: 0.85, 'hue-rotate': -10, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    warm:      { brightness: 1.05, contrast: 1, saturate: 1.2, 'hue-rotate': -15, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    cool:      { brightness: 1, contrast: 1, saturate: 1.1, 'hue-rotate': 20, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    dramatic:  { brightness: 0.85, contrast: 1.5, saturate: 1.2, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 },
    fade:      { brightness: 1.1, contrast: 0.85, saturate: 0.7, 'hue-rotate': 0, sepia: 0, grayscale: 0, blur: 0, invert: 0, opacity: 1 }
};

document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        filters = { ...PRESETS[btn.dataset.preset] };
        updateImageStyle();
        resetSliderThumb();
        pushState();
        showToast(btn.textContent);
    });
});

/* =========================================================
   9. AUTO ENHANCE
   ========================================================= */
document.getElementById('autoBtn').addEventListener('click', () => {
    filters.brightness = 1.05;
    filters.contrast = 1.2;
    filters.saturate = 1.25;
    updateImageStyle();
    resetSliderThumb();
    pushState();
    showToast('Auto enhanced');
});

/* =========================================================
   10. CROP  (works correctly with rotation/flip)
   ========================================================= */
function toggleCropMode() {
    cropActive = !cropActive;
    cropOverlay.style.display = cropActive ? 'block' : 'none';
    applyCropBtn.classList.toggle('hidden', !cropActive);

    // Reset crop rect to defaults when opening
    if (cropActive) {
        cropRect = { x: 0.15, y: 0.15, w: 0.7, h: 0.7 };
        updateCropOverlayPosition();
        textOverlay.style.display = 'none';
    } else {
        textOverlay.style.display = textActive ? 'block' : 'none';
    }
}

function updateCropOverlayPosition() {
    cropOverlay.style.left = `${cropRect.x * 100}%`;
    cropOverlay.style.top = `${cropRect.y * 100}%`;
    cropOverlay.style.width = `${cropRect.w * 100}%`;
    cropOverlay.style.height = `${cropRect.h * 100}%`;
}

let dragState = null;
function onDragStart(e) {
    const target = e.target;
    let corner = null;
    if (target.classList.contains('crop-handle')) corner = target.dataset.corner;
    else if (target === cropOverlay) corner = 'move';
    else return;

    dragState = {
        corner,
        startX: e.clientX,
        startY: e.clientY,
        startRect: { ...cropRect }
    };
